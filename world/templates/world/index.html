{% load static %}<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radi's World</title>
<meta name="description" content="Stories, history, audiobooks and comics by Radi the Storyteller.">
<meta name="theme-color" content="#0B0F1A">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="{% static 'world/icons/icon-192.png' %}">
<link rel="apple-touch-icon" href="{% static 'world/icons/icon-192.png' %}">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0B0F1A; --deep:#0E1422; --s1:#131B2C; --s2:#1A2335; --s3:#26314A;
  --line:rgba(154,166,189,.14); --line-2:rgba(154,166,189,.26);
  --ink:#F4F8FF; --soft:#C9D2E3; --mist:#9AA6BD; --dim:#66728A;
  --blue:#4DA3FF; --blue-hi:#7CBCFF; --gold:#F2B84B;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Newsreader",Georgia,serif; --serif:"Newsreader",Georgia,serif;
  --paper:#F1E5C8; --p-ink:#2E2116; --p-ink-2:#6B5640; --p-red:#8B3A1F; --p-line:rgba(46,33,22,.2);
  --pad:clamp(18px,4vw,56px); --hdr:64px;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html,body{overflow-x:hidden}
body{background:var(--night);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));font-feature-settings:"ss01"}
body.ar{--sans:"Noto Kufi Arabic",system-ui,sans-serif;--display:"Amiri",serif;--serif:"Amiri",serif}
body.ko{--sans:"Noto Sans KR",system-ui,sans-serif;--display:"Noto Serif KR",serif;--serif:"Noto Serif KR",serif}
body.ja{--sans:"Noto Sans JP",system-ui,sans-serif;--display:"Noto Serif JP",serif;--serif:"Noto Serif JP",serif}
body.zh{--sans:"Noto Sans SC",system-ui,sans-serif;--display:"Noto Serif SC",serif;--serif:"Noto Serif SC",serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}
.wrap{padding:0 var(--pad)}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:40;height:var(--hdr);display:flex;align-items:center;gap:28px;padding:0 var(--pad);
  transition:background .3s, box-shadow .3s}
.top.solid,.top.plain{background:rgba(11,15,26,.92);backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line)}
.top:not(.solid):not(.plain){background:linear-gradient(rgba(11,15,26,.75),rgba(11,15,26,0))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:500;font-size:22px;letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:30px;height:30px;flex:none}
.brand b{color:var(--gold);font-weight:500;font-style:italic}
.nav{display:flex;gap:22px}
.nav a{color:var(--mist);font-weight:600;font-size:14px;padding:6px 0;position:relative;transition:color .15s}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink)}
.nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;background:var(--blue)}
.tools{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
.search{background:rgba(19,27,44,.8);border:1px solid var(--line);border-radius:999px;padding:8px 14px;width:210px;color:var(--ink);font:inherit;font-size:14px;transition:border-color .15s, width .2s}
.search:focus{outline:none;border-color:var(--blue);width:260px}
.search::placeholder{color:var(--dim)}
.icon-btn{width:38px;height:38px;border-radius:999px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--soft);transition:background .15s,color .15s}
.icon-btn:hover{background:rgba(244,248,255,.08);color:var(--ink)}
#bell[aria-pressed="true"]{color:var(--blue)}
#bell .slash{display:none} #bell[aria-pressed="false"] .slash{display:inline}
#s-btn{display:none}
.lang-sel{background:transparent;color:var(--soft);border:1px solid var(--line);border-radius:999px;padding:7px 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-inline-start:4px}
.lang-sel option{background:var(--s1)}
@media (max-width:1180px){ .nav{display:none} }
@media (max-width:700px){
  :root{--hdr:56px}
  .brand{font-size:19px} .brand svg{width:26px;height:26px}
  .search{display:none;position:absolute;inset:8px 12px auto 12px;width:auto;z-index:2;padding:10px 16px}
  .top.s-open .search{display:block;width:auto}
  #s-btn{display:grid} .lang-sel,.top .opt{display:none}
}

/* ---------- bottom tabs ---------- */
.tabs{position:fixed;inset:auto 0 0 0;z-index:45;display:none;justify-content:space-around;
  background:rgba(11,15,26,.94);border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--dim);padding:2px 8px;min-width:56px}
.tabs a svg.i{width:22px;height:22px}
.tabs a.on{color:var(--ink)} .tabs a.on svg.i{color:var(--blue)}
@media (max-width:1180px){ .tabs{display:flex} }
@media (min-width:1181px){ body{padding-bottom:0} }

/* ---------- buttons ---------- */
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 22px;font-weight:700;cursor:pointer;font-size:14.5px;
  background:var(--ink);color:var(--night);transition:background .15s, transform .1s}
.btn:hover{background:#fff}
.btn:active{transform:scale(.97)}
.btn.blue{background:var(--blue);color:#04101F} .btn.blue:hover{background:var(--blue-hi)}
.btn.gold{background:var(--blue);color:#04101F} .btn.gold:hover{background:var(--blue-hi)}
.btn.ghost{background:rgba(244,248,255,.1);color:var(--ink);backdrop-filter:blur(6px)}
.btn.ghost:hover{background:rgba(244,248,255,.18)}
.btn.sm{padding:8px 15px;font-size:13.5px}
.btn svg.i{width:18px;height:18px}

/* ---------- hero carousel ---------- */
.hero{position:relative;height:min(84vh,780px);min-height:520px;margin-top:calc(var(--hdr) * -1);overflow:hidden;background:var(--deep)}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .9s ease, visibility 0s .9s}
.slide.on{opacity:1;visibility:visible;transition:opacity .9s ease}
.sl-bg{position:absolute;inset:0;background-size:cover;background-position:center 25%}
.slide.on .sl-bg{animation:drift 14s ease-out both}
@keyframes drift{from{transform:scale(1.06)}to{transform:scale(1)}}
.sl-bg.blur{filter:blur(38px) saturate(1.2) brightness(.55);transform:scale(1.2)!important;animation:none!important}
.slide::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg, rgba(11,15,26,.96) 0%, rgba(11,15,26,.72) 38%, rgba(11,15,26,.05) 75%),
             linear-gradient(0deg, var(--night) 0%, rgba(11,15,26,0) 38%)}
[dir=rtl] .slide::after{background:linear-gradient(270deg, rgba(11,15,26,.96) 0%, rgba(11,15,26,.72) 38%, rgba(11,15,26,.05) 75%),
             linear-gradient(0deg, var(--night) 0%, rgba(11,15,26,0) 38%)}
.sl-storm{position:absolute;inset:0;background:
  radial-gradient(60% 70% at 78% 30%, rgba(77,163,255,.28), transparent 70%),
  radial-gradient(40% 50% at 95% 90%, rgba(242,184,75,.10), transparent 70%), var(--deep)}
.sl-storm::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(244,248,255,.025) 0 1px, transparent 1px 5px)}
.sl-yr{position:absolute;inset-inline-end:clamp(-20px,3vw,80px);top:50%;transform:translateY(-55%);z-index:1;
  font-family:var(--display);font-style:italic;font-weight:400;font-size:clamp(150px,24vw,380px);line-height:.8;letter-spacing:-.04em;
  color:transparent;-webkit-text-stroke:1px rgba(242,184,75,.55);opacity:.8;white-space:nowrap}
.sl-cover{position:absolute;z-index:1;inset-inline-end:clamp(30px,9vw,160px);top:50%;transform:translateY(-50%) rotate(-3deg);
  width:clamp(170px,19vw,280px);aspect-ratio:2/3;border-radius:4px 8px 8px 4px;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06)}
.sl-cover.sq{aspect-ratio:1;border-radius:14px}
.sl-cover img{width:100%;height:100%;object-fit:cover}
.sl-cover .gen{padding:clamp(18px,2vw,28px)} .sl-cover .gen b{font-size:clamp(22px,2.4vw,34px)} .sl-cover .gen small{font-size:13px}
.sl-in{position:absolute;z-index:2;inset:auto auto clamp(90px,15vh,140px) var(--pad);max-width:min(600px,86vw)}
[dir=rtl] .sl-in{inset:auto var(--pad) clamp(90px,15vh,140px) auto}
.sl-kind{display:inline-flex;align-items:center;gap:8px;color:var(--blue-hi);font-weight:700;font-size:13.5px}
.sl-kind svg.i{width:16px;height:16px}
.sl-in h1{font-family:var(--display);font-weight:500;font-size:clamp(34px,4.8vw,62px);line-height:1.04;letter-spacing:-.015em;margin:12px 0 12px;text-wrap:balance}
.sl-meta{color:var(--soft);font-size:14px;display:flex;flex-wrap:wrap;gap:14px}
.sl-meta .y{color:var(--gold);font-family:var(--display);font-style:italic;font-size:17px;line-height:1.2}
.sl-desc{color:var(--soft);font-size:16px;line-height:1.6;margin-top:10px;max-width:52ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-nav{position:absolute;z-index:3;inset:auto var(--pad) 50px auto;display:flex;gap:18px}
[dir=rtl] .hero-nav{inset:auto auto 50px var(--pad)}
.hero-nav button{background:none;border:0;padding:8px 0 0;cursor:pointer;width:clamp(70px,9vw,130px);text-align:start;color:var(--dim);font-size:12.5px;font-weight:600;
  position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-nav button::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:rgba(244,248,255,.18);border-radius:2px}
.hero-nav button i{position:absolute;top:0;left:0;height:2px;width:0;background:var(--blue);border-radius:2px;box-shadow:0 0 10px var(--blue)}
.hero-nav button.on{color:var(--ink)}
.hero-nav button.on i{animation:fill var(--dur,8s) linear forwards}
.hero.paused .hero-nav button.on i{animation-play-state:paused}
@keyframes fill{to{width:100%}}
@media (max-width:760px){
  .hero{height:78vh;min-height:500px}
  .slide::after{background:linear-gradient(0deg, var(--night) 4%, rgba(11,15,26,.85) 42%, rgba(11,15,26,.15) 80%)}
  .sl-in{inset:auto var(--pad) 74px var(--pad)}
  .sl-yr{top:30%;font-size:44vw;inset-inline-end:-6vw}
  .sl-cover{top:30%;width:42vw}
  .hero-nav{inset:auto var(--pad) 26px var(--pad);gap:8px}
  .hero-nav button{width:auto;flex:1;font-size:0;padding-top:4px}
}

/* ---------- section doors ---------- */
.doors{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;padding:0 var(--pad);margin-top:-18px;position:relative;z-index:4}
.door{position:relative;height:112px;border-radius:14px;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;justify-content:flex-end;
  background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .2s}
.door:hover{box-shadow:inset 0 0 0 1px rgba(77,163,255,.6)}
.door b{position:relative;font-size:15px;font-weight:700}
.door small{position:relative;color:var(--mist);font-size:12.5px}
.door::before{content:"";position:absolute;inset:0}
.d-stories::before{background:linear-gradient(transparent 0 14px, transparent 14px),
  repeating-linear-gradient(90deg, rgba(244,248,255,.16) 0 8px, transparent 8px 16px) top/100% 6px no-repeat,
  repeating-linear-gradient(90deg, rgba(244,248,255,.16) 0 8px, transparent 8px 16px) bottom/100% 6px no-repeat,
  radial-gradient(80% 90% at 90% 20%, rgba(77,163,255,.35), transparent 70%)}
.d-history::before{background:radial-gradient(80% 90% at 90% 10%, rgba(242,184,75,.22), transparent 70%)}
.d-history::after{content:"1884";position:absolute;top:2px;inset-inline-end:10px;font-family:var(--display);font-style:italic;font-size:46px;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(242,184,75,.6)}
.d-books::before{background:repeating-linear-gradient(90deg, rgba(244,248,255,.07) 0 10px, rgba(77,163,255,.14) 10px 13px, transparent 13px 26px) top right/55% 62% no-repeat,
  radial-gradient(70% 90% at 90% 0%, rgba(124,188,255,.18), transparent 70%)}
.d-audio::before{background:repeating-linear-gradient(90deg, rgba(77,163,255,.55) 0 3px, transparent 3px 7px) right 16px top 20px/46% 26px no-repeat,radial-gradient(70% 90% at 90% 10%, rgba(77,163,255,.18), transparent 70%)}
.d-comics::before{background:radial-gradient(rgba(244,248,255,.22) 1.2px, transparent 1.6px) 0 0/8px 8px;
  -webkit-mask-image:linear-gradient(200deg,#000,transparent 60%);mask-image:linear-gradient(200deg,#000,transparent 60%)}
.d-art::before{inset:12px 12px auto auto;width:46%;height:52%;border:1px solid rgba(242,184,75,.45);border-radius:3px;
  background:linear-gradient(135deg, rgba(77,163,255,.25), rgba(242,184,75,.15));box-shadow:0 0 0 5px rgba(244,248,255,.04)}
[dir=rtl] .d-art::before{inset:12px auto auto 12px}
@media (max-width:1000px){ .doors{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:560px){ .doors{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px} .door{height:92px} }

/* ---------- rows ---------- */
.row{margin:44px 0 0}
.row-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:0 var(--pad);margin-bottom:14px}
.row-h h2{font-family:var(--display);font-weight:500;font-size:clamp(21px,2vw,26px);letter-spacing:-.01em;line-height:1.2}
.row-h .more{color:var(--mist);font-weight:600;font-size:13.5px;white-space:nowrap;transition:color .15s}
.row-h:hover .more{color:var(--blue-hi)}
.row-sub{color:var(--mist);font-size:14px;padding:0 var(--pad);margin:-8px 0 14px}
.track{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 var(--pad);padding:4px var(--pad) 12px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track > *{scroll-snap-align:start;flex:none}
.empty{color:var(--mist);background:var(--s1);border-radius:12px;padding:18px 20px;max-width:520px;font-size:14.5px;box-shadow:inset 0 0 0 1px var(--line)}

/* ---------- cards (one per section personality) ---------- */
.card{display:block;background:none;border:0;padding:0;cursor:pointer;text-align:start;width:clamp(220px,22vw,300px)}
.card .art{position:relative;overflow:hidden;aspect-ratio:16/9;background:var(--s2);border-radius:10px}
.card .art::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(244,248,255,.07);pointer-events:none;transition:box-shadow .2s}
.card:hover .art::after{box-shadow:inset 0 0 0 2px rgba(77,163,255,.7)}
.card .art img{width:100%;height:100%;object-fit:cover}
.card .cap{padding:10px 2px 0}
.card .cap b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;font-size:14.5px;line-height:1.35;color:var(--ink)}
.card .cap small{display:block;color:var(--mist);font-size:12.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{position:absolute;top:9px;inset-inline-start:9px;background:rgba(11,15,26,.72);backdrop-filter:blur(6px);color:var(--ink);font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px}
.play{position:absolute;inset:auto auto 10px 10px;width:34px;height:34px;border-radius:50%;background:rgba(11,15,26,.6);backdrop-filter:blur(6px);display:grid;place-items:center;
  box-shadow:inset 0 0 0 1px rgba(244,248,255,.35)}
.play svg.i{width:14px;height:14px;fill:currentColor;stroke:none;margin-inline-start:2px}
[dir=rtl] .play{inset:auto 10px 10px auto}
.dur{position:absolute;inset:auto 9px 9px auto;background:rgba(11,15,26,.75);font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(244,248,255,.18)} .prog i{display:block;height:100%;background:var(--blue)}

/* books: covers with a spine, sitting on a shelf */
.card.k-b,.card.k-c{width:clamp(138px,13vw,172px)}
.card.k-b .art{aspect-ratio:2/3;border-radius:3px 7px 7px 3px;box-shadow:0 14px 26px rgba(0,0,0,.5)}
.card.k-b .art::before{content:"";position:absolute;z-index:1;inset:0 auto 0 0;width:9px;background:linear-gradient(90deg, rgba(0,0,0,.35), rgba(255,255,255,.08) 55%, rgba(0,0,0,.15));pointer-events:none}
/* comics: bold frame */
.card.k-c .art{aspect-ratio:2/3;border-radius:4px;box-shadow:0 0 0 3px var(--ink), 0 14px 26px rgba(0,0,0,.5)}
.card.k-c{padding:3px}
/* audiobooks: square with a waveform */
.card.k-a{width:clamp(160px,15vw,196px)} .card.k-a .art{aspect-ratio:1;border-radius:16px}
.card.k-a .wave{position:absolute;inset:auto 12px 12px 12px;height:26px;color:rgba(124,188,255,.9)}
.card.k-a .wave svg{width:100%;height:100%;display:block}
/* art: gallery mat */
.card.k-r{width:clamp(180px,17vw,230px)}
.card.k-r .art{aspect-ratio:4/5;border-radius:3px;padding:10px;background:#E9E4DA}
.card.k-r .art img,.card.k-r .art .poem{border-radius:1px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
/* history: engraved plates */
.card.k-h .art{border-radius:8px}
.card.k-h .play{inset:12px 12px auto auto} [dir=rtl] .card.k-h .play{inset:12px auto auto 12px}
.plate{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:14px 16px;overflow:hidden;
  background:radial-gradient(110% 100% at 100% 0%, var(--tint,#1D2A44) 0%, transparent 65%), #0F1626}
.plate::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(244,248,255,.035) 0 1px, transparent 1px 4px)}
.plate::after{content:"";position:absolute;inset:10px;border:1px solid rgba(242,184,75,.16);border-radius:4px;pointer-events:none}
.plate .yr{position:relative;font-family:var(--display);font-style:italic;font-weight:400;font-size:clamp(30px,3vw,40px);line-height:1;color:var(--gold);letter-spacing:-.01em}
.plate .rg{position:relative;font-size:12px;color:var(--mist);margin-top:5px;font-weight:600}
.card .yrb{position:absolute;inset:auto auto 12px 14px;font-family:var(--display);font-style:italic;font-size:clamp(26px,2.4vw,34px);line-height:1;color:var(--gold);text-shadow:0 2px 14px rgba(0,0,0,.7)}
[dir=rtl] .card .yrb{inset:auto 14px 12px auto}
.card .yrb small{display:block;font-family:var(--sans);font-style:normal;font-size:12px;font-weight:600;color:var(--soft);margin-top:5px}
.sl-bg.art{background-position:68% 50%}
@media (max-width:760px){ .sl-bg.art{background-position:72% 8%;background-size:auto 62%;background-repeat:no-repeat} }
.otd-lead.has-art{background:linear-gradient(90deg, rgba(19,27,44,.97) 25%, rgba(19,27,44,.55) 65%, rgba(19,27,44,.2)), var(--art) 68% 50%/cover no-repeat, var(--s1)}
[dir=rtl] .otd-lead.has-art{background:linear-gradient(270deg, rgba(19,27,44,.97) 25%, rgba(19,27,44,.55) 65%, rgba(19,27,44,.2)), var(--art) 32% 50%/cover no-repeat, var(--s1)}
.frame .plate .yr{font-size:clamp(70px,13vw,150px)}

/* generated covers (used until a real cover is uploaded) */
.gen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:16px 14px 14px;
  background:linear-gradient(165deg,var(--a),var(--b))}
.gen .motif{position:absolute;inset:0 0 38% 0;width:100%;height:62%}
.gen-t{position:relative;margin-top:auto}
.gen-t small{display:block;margin-top:6px}
.gen-b::after{content:"";position:absolute;inset:8px;border:1px solid rgba(242,184,75,.22);border-radius:2px;pointer-events:none}
.gen b{font-family:var(--display);font-weight:500;font-size:19px;line-height:1.12;letter-spacing:-.005em;text-wrap:balance}
.gen small{color:rgba(244,248,255,.62);font-size:11px;font-weight:600}
.gen .orn{width:26px;height:1px;background:var(--gold);opacity:.7;margin-bottom:10px}
.gen-c{background:radial-gradient(rgba(244,248,255,.13) 1.1px, transparent 1.5px) 0 0/7px 7px, linear-gradient(165deg,var(--a),var(--b))}
.gen-c b{font-family:var(--sans);font-weight:800;font-size:20px;text-transform:none;letter-spacing:-.02em}
.gen-a .motif{inset:0 0 45% 0}
.gen-a b{font-size:18px}
.poem{position:absolute;inset:10px;padding:18px 16px;background:#F7F3EA;color:#2A2A34;font-family:var(--display);font-style:italic;
  font-size:14.5px;line-height:1.5;white-space:pre-line;overflow:hidden;-webkit-mask-image:linear-gradient(#000 72%,transparent)}

/* ---------- on this day: editorial spread ---------- */
.otd{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(18px,3vw,44px);padding:0 var(--pad)}
.otd-lead{position:relative;text-align:start;border:0;cursor:pointer;color:var(--ink);border-radius:16px;overflow:hidden;padding:clamp(22px,3vw,36px);
  min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;
  background:radial-gradient(90% 90% at 100% 0%, rgba(242,184,75,.16), transparent 60%), radial-gradient(70% 80% at 0% 100%, rgba(77,163,255,.14), transparent 70%), var(--s1);
  box-shadow:inset 0 0 0 1px var(--line)}
.otd-lead:hover{box-shadow:inset 0 0 0 1px rgba(77,163,255,.6)}
.otd-lead .y{font-family:var(--display);font-style:italic;font-size:clamp(64px,8vw,110px);line-height:.85;color:var(--gold);letter-spacing:-.03em}
.otd-lead h3{font-family:var(--display);font-weight:500;font-size:clamp(24px,2.4vw,32px);line-height:1.15;margin:14px 0 8px;max-width:22ch}
.otd-lead p{color:var(--soft);max-width:56ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.otd-lead .pl{color:var(--mist);font-size:13px;margin-top:12px}
.otd-list{list-style:none;padding:0;display:flex;flex-direction:column}
.otd-list button{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:baseline;width:100%;text-align:start;background:none;border:0;
  border-top:1px solid var(--line);padding:16px 2px;cursor:pointer;color:var(--ink)}
.otd-list li:last-child button{border-bottom:1px solid var(--line)}
.otd-list .y{font-family:var(--display);font-style:italic;font-size:24px;color:var(--gold);line-height:1}
.otd-list b{display:block;font-weight:600;font-size:15px;line-height:1.35}
.otd-list small{color:var(--mist);font-size:12.5px}
.otd-list button:hover b{color:var(--blue-hi)}
@media (max-width:860px){ .otd{grid-template-columns:1fr} .otd-lead{min-height:240px} }

/* ---------- timeline of eras ---------- */
.timeline{display:flex;padding:8px var(--pad) 6px;overflow-x:auto;scrollbar-width:none;position:relative}
.timeline::-webkit-scrollbar{display:none}
.era{flex:1 0 150px;position:relative;background:none;border:0;cursor:pointer;text-align:start;padding:26px 14px 6px 0;color:var(--ink)}
.era::before{content:"";position:absolute;top:8px;left:0;right:0;height:1px;background:var(--line-2)}
.era::after{content:"";position:absolute;top:3px;left:0;width:11px;height:11px;border-radius:50%;background:var(--night);box-shadow:inset 0 0 0 2px var(--gold);transition:background .15s}
[dir=rtl] .era::after{left:auto;right:0}
.era:hover::after{background:var(--gold)}
.era b{display:block;font-family:var(--display);font-weight:500;font-size:18px;line-height:1.2}
.era small{color:var(--mist);font-size:12.5px}

/* ---------- pages ---------- */
.view{display:none}
.view.on{display:block}
.page-h{padding:clamp(28px,5vw,56px) var(--pad) 8px;max-width:900px}
.page-h h1{font-family:var(--display);font-weight:500;font-size:clamp(34px,4.6vw,56px);line-height:1.05;letter-spacing:-.02em}
.page-h p{color:var(--mist);max-width:60ch;margin-top:8px;font-size:15.5px}
.page-h .back{color:var(--mist);font-weight:600;font-size:14px;display:inline-flex;gap:6px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(44vw,250px),1fr));gap:28px 18px;padding:18px var(--pad) 24px}
.grid .card{width:auto}
.grid.tall{grid-template-columns:repeat(auto-fill,minmax(min(40vw,160px),1fr))}
.grid.sqg{grid-template-columns:repeat(auto-fill,minmax(min(42vw,190px),1fr))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:7px 15px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--soft)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--night);box-shadow:none}
.filters{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center;padding:14px var(--pad)}
.filters label{color:var(--mist);font-size:13px;font-weight:600;margin-inline-end:8px}
.sel{background:var(--s1);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px}
.datebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px var(--pad) 0;padding:12px 14px;background:var(--s1);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);width:max-content;max-width:calc(100% - 2 * var(--pad))}
.datebar .lbl{font-weight:600;margin-inline-end:6px;color:var(--soft);font-size:14px}
.era-h{display:flex;align-items:center;gap:14px;padding:30px var(--pad) 0;font-family:var(--display);font-weight:500;font-size:22px}
.era-h::after{content:"";flex:1;height:1px;background:var(--line)}
.yt-band{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin:18px var(--pad) 0;padding:16px 20px;border-radius:14px;
  background:radial-gradient(80% 140% at 100% 0%, rgba(77,163,255,.22), transparent 60%), var(--s1);box-shadow:inset 0 0 0 1px var(--line)}
.yt-band b{font-weight:600}

.channel{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:28px;align-items:center;padding:18px var(--pad) 8px}
.channel-player{aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line), 0 30px 60px rgba(0,0,0,.45)}
.channel-player iframe{width:100%;height:100%;border:0;display:block}
.channel-side h2{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.15;margin-bottom:8px}
.channel-side p{color:var(--mist);margin-bottom:16px}
.channel-card{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-height:200px;max-width:720px;padding:22px 24px;border-radius:16px;
  background:repeating-linear-gradient(90deg, rgba(244,248,255,.12) 0 10px, transparent 10px 20px) top/100% 7px no-repeat,
  repeating-linear-gradient(90deg, rgba(244,248,255,.12) 0 10px, transparent 10px 20px) bottom/100% 7px no-repeat,
  radial-gradient(70% 90% at 85% 25%, rgba(77,163,255,.35), transparent 70%), var(--s1);box-shadow:inset 0 0 0 1px var(--line)}
.channel-card .play{inset:22px auto auto 24px;width:52px;height:52px} .channel-card .play svg.i{width:20px;height:20px}
.channel-card b{font-family:var(--display);font-weight:500;font-size:26px}
.channel-card small{color:var(--mist)}
@media (max-width:860px){ .channel{grid-template-columns:1fr} }
/* settings */
.panel{background:var(--s1);border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);padding:20px 22px;margin:14px var(--pad) 0;max-width:780px}
.panel h2{font-family:var(--display);font-weight:500;font-size:21px;margin-bottom:4px}
.panel p{color:var(--mist);margin-bottom:12px;font-size:14px}
.note{font-size:13.5px;color:var(--mist);margin-top:14px}
.switch{display:inline-flex;align-items:center;gap:12px;cursor:pointer;background:none;border:0;padding:0;font-weight:700;font-size:15px}
.switch i{width:50px;height:28px;border-radius:999px;background:var(--s3);position:relative;transition:background .2s;flex:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .2s}
.switch[aria-checked="true"] i{background:var(--blue)}
.switch[aria-checked="true"] i::after{transform:translateX(22px)}
[dir=rtl] .switch i::after{left:auto;right:3px}
[dir=rtl] .switch[aria-checked="true"] i::after{transform:translateX(-22px)}

/* ---------- detail sheet ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(5,8,14,.78);overflow-y:auto;padding:32px 14px;backdrop-filter:blur(8px)}
.sheet.on{display:block;animation:sheetIn .25s ease}
@keyframes sheetIn{from{opacity:0}to{opacity:1}}
.sheet-in{max-width:1060px;margin:0 auto;background:var(--deep);border-radius:18px;box-shadow:0 0 0 1px var(--line), 0 40px 100px rgba(0,0,0,.6);overflow:hidden}
.sheet-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px}
.close{border:0;background:rgba(244,248,255,.08);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:16px;flex:none;margin-inline-start:auto;color:var(--ink)}
.close:hover{background:rgba(244,248,255,.16)}
.ratio{display:flex;gap:2px;background:var(--s1);border-radius:999px;padding:3px}
.ratio button{border:0;background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--mist)}
.ratio button[aria-pressed="true"]{background:var(--ink);color:var(--night)}
.stage{background:#000;display:flex;justify-content:center}
.frame{position:relative;width:100%;max-height:72vh;background:#000}
.frame video,.frame img,.frame iframe{width:100%;height:100%;display:block;object-fit:contain;border:0;background:#000}
.frame[data-r="9x16"]{aspect-ratio:9/16;width:auto;height:72vh;max-width:100%}
.frame[data-r="16x9"]{aspect-ratio:16/9}
.soon{position:absolute;inset:auto 0 0 0;padding:14px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:var(--soft);text-align:center;font-size:14px}
.soon.top{inset:0 0 auto 0;background:linear-gradient(rgba(0,0,0,.75),transparent)}
.sheet-body{padding:26px clamp(18px,4vw,44px) 36px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:40px}
.sheet-body h2{font-family:var(--display);font-weight:500;font-size:clamp(28px,3.2vw,40px);line-height:1.1;letter-spacing:-.01em;margin:6px 0 6px;text-wrap:balance}
.sheet-body .yr{font-family:var(--display);font-style:italic;color:var(--gold);font-size:40px;line-height:1}
.eyebrow{color:var(--blue-hi);font-size:13px;font-weight:700}
.meta{color:var(--mist);font-size:14px}
.sheet-body .txt{font-family:var(--serif);font-size:19px;line-height:1.7;max-width:62ch;margin-top:20px;white-space:pre-line;color:var(--soft)}
.side h3{font-size:13.5px;margin-bottom:6px;color:var(--mist);font-weight:600}
.mini{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;text-align:start;cursor:pointer;color:var(--ink)}
.mini b{color:var(--gold);font-family:var(--display);font-style:italic;font-weight:400;font-size:17px;flex:none;min-width:48px}
.mini img{width:88px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;flex:none}
.mini span{font-size:14px;line-height:1.35}
.mini:hover span{color:var(--blue-hi)}
@media (max-width:760px){
  .sheet{padding:0}
  .sheet-in{border-radius:0;min-height:100%}
  .sheet-body{grid-template-columns:1fr;gap:26px}
  .frame[data-r="9x16"]{height:70vh}
}
/* narration */
.narr{margin-top:20px;background:var(--s1);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);padding:14px 16px;max-width:620px}
.narr h4{font-size:14px;font-weight:700;margin-bottom:10px}
.narr .row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.narr .chip.rec::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-inline-start:7px;vertical-align:middle}
.narr .src{font-size:13px;color:var(--mist);margin-top:8px}
.narr .other{margin-top:8px;font-size:13px;color:var(--mist)}
.narr .other button{background:none;border:0;color:var(--blue-hi);cursor:pointer;font-weight:700;padding:0 4px}
.bar{height:3px;background:var(--s3);border-radius:3px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue)}
/* audiobook / ebook detail */
.ab{display:grid;grid-template-columns:240px minmax(0,1fr);gap:34px;padding:6px clamp(18px,4vw,44px) 36px}
.ab .cover{border-radius:16px;overflow:hidden;aspect-ratio:1;background:var(--s2);box-shadow:0 24px 50px rgba(0,0,0,.55)}
.ab .cover img{width:100%;height:100%;object-fit:cover}
.ab h2{font-family:var(--display);font-weight:500;font-size:clamp(28px,3vw,40px);line-height:1.1}
.ab audio{width:100%;margin-top:18px}
.ch{display:flex;justify-content:space-between;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;cursor:pointer;text-align:start;color:var(--ink);font-size:14.5px}
.ch.on{color:var(--blue-hi);font-weight:700}
.ch small{color:var(--mist)}
@media (max-width:760px){ .ab{grid-template-columns:1fr} .ab .cover{max-width:220px} }
.art-full{display:flex;justify-content:center;background:#E9E4DA;padding:clamp(16px,3vw,34px)}
.art-full img{max-height:76vh;width:auto;max-width:100%;object-fit:contain;box-shadow:0 10px 30px rgba(0,0,0,.35)}

.amb-mini{position:fixed;z-index:46;inset:auto 16px calc(84px + env(safe-area-inset-bottom)) auto;display:flex;align-items:center;gap:10px;
  background:rgba(19,27,44,.92);backdrop-filter:blur(12px);border-radius:999px;padding:7px 8px 7px 14px;box-shadow:0 0 0 1px var(--line), 0 10px 30px rgba(0,0,0,.4);font-size:13px;font-weight:600}
.amb-mini[hidden]{display:none}
.amb-mini i{width:14px;height:14px;background:linear-gradient(var(--blue),var(--blue)) 0 100%/3px 60% no-repeat, linear-gradient(var(--blue),var(--blue)) 5px 100%/3px 100% no-repeat, linear-gradient(var(--blue),var(--blue)) 10px 100%/3px 40% no-repeat;animation:eq 1.2s ease-in-out infinite alternate}
@keyframes eq{to{background-size:3px 30%,3px 50%,3px 90%}}
.amb-mini button{border:0;background:rgba(244,248,255,.1);color:var(--ink);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:12px}
@media (min-width:1181px){ .amb-mini{bottom:24px} }
[dir=rtl] .amb-mini{inset:auto auto calc(84px + env(safe-area-inset-bottom)) 16px}
/* onboarding + toast */
.onb{position:fixed;inset:0;z-index:90;background:rgba(5,8,14,.86);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(8px)}
.onb.on{display:flex}
.onb-in{background:var(--deep);border-radius:22px;box-shadow:0 0 0 1px var(--line), 0 40px 100px rgba(0,0,0,.6);max-width:520px;width:100%;padding:34px 30px;text-align:center}
.onb-in svg{width:56px;height:56px;margin:0 auto 14px}
.onb-in h2{font-family:var(--display);font-weight:500;font-size:32px;line-height:1.15}
.onb-in h2 b{color:var(--gold);font-weight:500;font-style:italic}
.onb-in p{color:var(--mist);margin:10px 0 20px}
.onb-in .chips{justify-content:center}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--night);padding:10px 18px;font-weight:600;font-size:14px;
  border-radius:999px;z-index:95;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
footer{color:var(--dim);font-size:13px;padding:56px var(--pad) 28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--mist)} footer a:hover{color:var(--ink)}

/* ---------- book reader (vintage paper kept on purpose) ---------- */
.book-ov{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:16px;background:radial-gradient(ellipse at 50% 40%, #1D2638 0%, #05070C 78%)}
.book-ov.on{display:flex}
.book-bar{display:flex;gap:10px;align-items:center;color:var(--mist);font-size:15px}
.book-bar button{background:rgba(244,248,255,.08);color:var(--ink);border:1px solid rgba(244,248,255,.22);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600}
.book-bar button:disabled{opacity:.35;cursor:default}
.book{position:relative;perspective:2200px;width:min(92vw, calc((100vh - 140px) * 1.36));aspect-ratio:1.36/1}
.book.single{width:min(92vw, calc((100vh - 140px) * 0.68));aspect-ratio:.68/1}
.book .half{position:absolute;top:0;bottom:0;width:50%}
.book.single .half{width:100%}
.book .h-left{left:0}.book .h-right{right:0}
.book.single .h-left{display:none}
.pg{position:absolute;inset:0;overflow:hidden;padding:clamp(18px,4%,40px) clamp(18px,7%,52px);display:flex;flex-direction:column;
  background:var(--paper);color:var(--p-ink);font-family:var(--serif);
  background-image:radial-gradient(ellipse at 50% 50%, rgba(255,250,235,.55) 0%, rgba(0,0,0,0) 65%);
  box-shadow:inset 0 0 50px rgba(110,80,45,.25)}
.h-left .pg{border-radius:6px 0 0 6px;background-image:radial-gradient(ellipse at 50% 50%, rgba(255,250,235,.55) 0%, rgba(0,0,0,0) 65%), linear-gradient(to left, rgba(80,55,30,.28), rgba(0,0,0,0) 9%)}
.h-right .pg{border-radius:0 6px 6px 0;background-image:radial-gradient(ellipse at 50% 50%, rgba(255,250,235,.55) 0%, rgba(0,0,0,0) 65%), linear-gradient(to right, rgba(80,55,30,.28), rgba(0,0,0,0) 9%)}
.book.single .h-right .pg{border-radius:4px 6px 6px 4px}
.book::after{content:"";position:absolute;inset:-10px;z-index:-1;border-radius:10px;background:#141B2B;box-shadow:0 0 0 1px rgba(242,184,75,.35), 0 30px 60px rgba(0,0,0,.65)}
.pg .pn{margin-top:auto;text-align:center;font-size:14px;color:var(--p-ink-2);padding-top:8px}
.pg.cover{justify-content:center;align-items:center;text-align:center;background:#0B0F1A;color:var(--ink);font-family:var(--sans);
  background-image:radial-gradient(ellipse at 50% 35%, rgba(77,163,255,.22), rgba(0,0,0,0) 65%);
  box-shadow:inset 0 0 0 12px #0B0F1A, inset 0 0 0 13px var(--gold), inset 0 0 0 19px #0B0F1A, inset 0 0 0 20px rgba(242,184,75,.5)}
.pg.cover svg{width:clamp(30px,5vh,46px);height:auto;margin-bottom:8px}
.pg.cover .c-eb{letter-spacing:.2em;font-weight:700;font-size:clamp(11px,1.5vh,15px);color:var(--mist);text-transform:uppercase}
.pg.cover .c-yr{font-family:var(--display);font-weight:900;font-size:clamp(50px,10vh,112px);color:var(--gold);line-height:1;margin:14px 0}
.pg.cover h2{font-family:var(--display);font-size:clamp(22px,3.5vh,38px);max-width:16ch;line-height:1.15}
.pg.cover .c-by{margin-top:22px;font-style:italic;color:var(--mist)}
.pg h3{font-family:var(--display);font-size:clamp(20px,3vh,30px);margin-bottom:10px;color:var(--p-red)}
.pg p{margin:0 0 .7em;font-size:clamp(15px,2.3vh,21px);line-height:1.55;text-align:justify;hyphens:auto}
.pg p.first::first-letter{float:inline-start;font-family:var(--display);font-weight:900;font-size:3.4em;line-height:.82;margin-top:4px;margin-inline-end:8px;color:var(--p-red)}
.pg .facts{border-top:1px solid var(--p-line);border-bottom:1px solid var(--p-line);padding:8px 0;margin:6px 0 14px;font-size:clamp(14px,2vh,18px)}
.pg .facts b{color:var(--p-red)}
.pg .also{border-top:1px solid var(--p-line);padding:8px 0}
.pg .also b{font-family:var(--display);color:var(--p-red)}
.pg.end{justify-content:center;text-align:center;align-items:center}
.pg.blank{background-color:#EDE0C2}
.pg.img{padding:0;background:#0B0F1A}
.pg.img img{width:100%;height:100%;object-fit:contain}
.book.single .pg p{text-align:start;hyphens:none}
.pg[lang="ja"] p,.pg[lang="zh"] p,.pg[lang="ko"] p{text-align:start}
.leaf{position:absolute;top:0;bottom:0;width:50%;transform-style:preserve-3d;z-index:5}
.book.single .leaf{width:100%}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.leaf .face.back{transform:rotateY(180deg)}
.leaf .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right, rgba(0,0,0,.25), rgba(0,0,0,0) 60%);opacity:0}

<script>
"use strict";
const DATA = JSON.parse(document.getElementById("app-data").textContent);
const VAPID = "{{ vapid_public_key }}";
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const store = {
  get(k, d){ try{ const v = localStorage.getItem("rw:" + k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("rw:" + k, JSON.stringify(v)); }catch(e){} }
};
let LANG = store.get("lang", null) || "en";
const state = {
  topics: store.get("topics", DATA.topics.slice()),
  voice: store.get("voice", "female"),
  ratio: store.get("ratio", "auto"),
  list: store.get("list", []),
  hFilter: { era: "all", region: "all", topic: "all" },
  kind: "all",
  current: null
};
function t(k, v){ let s = (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k;
  if(v) for(const [a, b] of Object.entries(v)) s = s.split("{" + a + "}").join(b); return s; }
function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(m){ const el = $("#toast"); el.textContent = m; el.classList.add("on"); clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove("on"), 2600); }
function csrf(){ const m = document.cookie.match(/csrftoken=([^;]+)/); return m ? m[1] : ""; }

/* ---------- content model ---------- */
const REGION_STYLE = {
  tanzania:["🌄","linear-gradient(140deg,#123B2E 0%,#0B0F1A 75%)"], east_africa:["⛵","linear-gradient(140deg,#0E3346 0%,#0B0F1A 75%)"],
  africa:["🌍","linear-gradient(140deg,#4A2C12 0%,#0B0F1A 75%)"], europe:["🏛","linear-gradient(140deg,#262E4A 0%,#0B0F1A 75%)"],
  asia:["⛩","linear-gradient(140deg,#4A1B22 0%,#0B0F1A 75%)"], middle_east:["🕌","linear-gradient(140deg,#4A3A12 0%,#0B0F1A 75%)"],
  americas:["🗽","linear-gradient(140deg,#1B3A4A 0%,#0B0F1A 75%)"], oceania:["🌊","linear-gradient(140deg,#0D3C44 0%,#0B0F1A 75%)"],
  world:["🌐","linear-gradient(140deg,#1D2638 0%,#0B0F1A 75%)"], space:["🚀","linear-gradient(140deg,#24154A 0%,#05070C 75%)"]
};
const ERAS = [["ancient",-1e6,500,"🏺","linear-gradient(140deg,#5A3A15,#0B0F1A)"],["medieval",500,1500,"🏰","linear-gradient(140deg,#3B2A4A,#0B0F1A)"],
  ["early",1500,1800,"⚓","linear-gradient(140deg,#123A4A,#0B0F1A)"],["c19",1800,1900,"🚂","linear-gradient(140deg,#4A2414,#0B0F1A)"],
  ["c20",1900,2000,"✈","linear-gradient(140deg,#14324A,#0B0F1A)"],["c21",2000,1e6,"🛰","linear-gradient(140deg,#24154A,#0B0F1A)"]];
const eraOf = y => ERAS.find(e => y >= e[1] && y < e[2])[0];
let H = [], V = [], A = [], C = [], B = [], R = [], byKey = {};
const fmt = (o, d) => new Intl.DateTimeFormat(LANG_LOCALE[LANG], Object.assign({ timeZone: "UTC" }, o)).format(d);
const dayLabel = (day, m) => fmt({ day: "numeric", month: "long" }, new Date(Date.UTC(2000, m - 1, day)));
const monthName = m => fmt({ month: "long" }, new Date(Date.UTC(2000, m - 1, 1)));
const fullDate = iso => iso ? fmt({ day: "numeric", month: "short", year: "numeric" }, new Date(iso + "T00:00:00Z")) : "";
function yearLabel(e){ if(e.und) return t("old_trad"); let y = e.y < 0 ? t("bce", { y: -e.y }) : String(e.y); return e.circa ? t("circa", { y }) : y; }
function build(){
  H = DATA.history.map(e => {
    const L = e.tr[LANG] || e.tr.en || Object.values(e.tr)[0];
    const [dd, mm] = e.d ? e.d.split("-").map(Number) : [null, null];
    return Object.assign({}, e, { key: "h:" + e.id, type: "h", title: L.title, place: L.place, text: L.text, translated: !!e.tr[LANG],
      day: dd, date: e.d ? dayLabel(dd, mm) : "", ylab: yearLabel(e), era: eraOf(e.y),
      img: e.h169 || e.h916, art: e.art || "", video: !!(e.v169 || e.v916) });
  }).sort((a, b) => a.y - b.y);
  V = DATA.videos.map(v => Object.assign({}, v, { key: "v:" + v.id, type: "v" })).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  A = DATA.audiobooks.map(a => Object.assign({}, a, { key: "a:" + a.id, type: "a" }));
  C = DATA.comics.map(c => Object.assign({}, c, { key: "c:" + c.id, type: "c" }));
  B = (DATA.books || []).map(b => Object.assign({}, b, { key: "b:" + b.id, type: "b" }));
  R = (DATA.art || []).map(r => Object.assign({}, r, { key: "r:" + r.id, type: "r" }));
  byKey = {}; [...H, ...V, ...A, ...C, ...B, ...R].forEach(x => byKey[x.key] = x);
}
const regName = r => t("reg_" + r), catName = c => t("cat_" + c);
const ytChannel = () => { const c = (DATA.channel || "").trim(); if(!c) return "";
  if(/^https?:/.test(c)) return c; if(c.startsWith("@")) return "https://www.youtube.com/" + c;
  if(/^UC[\w-]{20,}$/.test(c)) return "https://www.youtube.com/channel/" + c; return "https://www.youtube.com/@" + c; };

/* ---------- cards: one look per section ---------- */
const TINT = { tanzania:"#17402F", east_africa:"#123A4E", africa:"#4A2E14", europe:"#25304E", asia:"#4A1D27", middle_east:"#4A3914",
  americas:"#173B4E", oceania:"#0F3D45", world:"#1F2A44", space:"#2A1A50" };
const PAL = [["#1E2E52","#0B0F1A"],["#3A2348","#0E0B1A"],["#143E3C","#081414"],["#4D2C17","#140B06"],["#18324F","#070D18"],["#33304E","#0C0B18"]];
const hashN = s => { let h = 7; for(const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
const ico = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const bare = s => String(s).replace(/^[^\p{L}\p{N}]+/u, "");
function wave(seed){ let h = hashN(seed) || 1, r = "";
  for(let i = 0; i < 32; i++){ h = (h * 1103515245 + 12345) & 0x7fffffff; const v = 4 + (h % 20); r += `<rect x="${i * 6}" y="${(26 - v) / 2}" width="3" height="${v}" rx="1.5"/>`; }
  return `<div class="wave"><svg viewBox="0 0 190 26" preserveAspectRatio="none" fill="currentColor">${r}</svg></div>`; }
function plate(e){ return `<div class="plate" style="--tint:${TINT[e.region] || TINT.world}"><span class="yr">${esc(e.ylab)}</span><span class="rg">${esc(regName(e.region))}</span></div>`; }
function motif(seed){
  const h = hashN(seed), m = h % 5, G = "#F2B84B", B = "#7CBCFF";
  if(m === 0) return Array.from({ length: 9 }, (_, i) => `<circle cx="100" cy="150" r="${18 + i * 13}" stroke="${i % 3 ? B : G}" stroke-opacity="${.55 - i * .05}"/>`).join("");
  if(m === 1) return Array.from({ length: 7 }, (_, i) => `<path d="M-10 ${60 + i * 16} Q 50 ${40 + i * 16} 100 ${60 + i * 16} T 210 ${60 + i * 16}" stroke="${i === 3 ? G : B}" stroke-opacity="${.25 + (i % 3) * .15}"/>`).join("");
  if(m === 2) return `<path d="M-10 170 L45 80 L80 130 L120 55 L160 120 L210 70" stroke="${G}" stroke-opacity=".7"/><path d="M-10 185 L40 120 L90 160 L140 100 L210 150" stroke="${B}" stroke-opacity=".45"/><circle cx="150" cy="45" r="16" stroke="${G}" stroke-opacity=".7"/>`;
  if(m === 3) return `<path d="M112 20 L72 108 H104 L88 180 L140 82 H106 L124 20Z" stroke="${G}" stroke-opacity=".85"/>` + Array.from({ length: 5 }, (_, i) => `<path d="M${10 + i * 40} 0 L${30 + i * 40} 200" stroke="${B}" stroke-opacity=".12"/>`).join("");
  return Array.from({ length: 16 }, (_, i) => { const a = i / 16 * Math.PI * 2; return `<path d="M100 120 L${100 + Math.cos(a) * 140} ${120 + Math.sin(a) * 140}" stroke="${i % 4 ? B : G}" stroke-opacity="${i % 4 ? .18 : .5}"/>`; }).join("") + `<circle cx="100" cy="120" r="26" stroke="${G}" stroke-opacity=".8"/>`;
}
function genCover(x){ const ty = x.type || "b", [a, b] = PAL[hashN(x.id || x.title) % PAL.length];
  return `<div class="gen gen-${ty}" style="--a:${a};--b:${b}"><svg class="motif" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" fill="none" stroke-width="1.4">${motif(x.id || x.title)}</svg>
    <div class="gen-t"><div class="orn"></div><b>${esc(x.title)}</b><small>${esc(x.author || "Radi the Storyteller")}</small></div></div>`; }
const PLAY = `<span class="play">${ico("play")}</span>`;
function card(x){
  if(!x) return "";
  const cap = (a, b) => `<div class="cap"><b>${esc(a)}</b>${b ? `<small>${esc(b)}</small>` : ""}</div>`;
  const open = (inner, c) => `<button class="card k-${x.type}" data-open="${x.key}"><div class="art">${inner}</div>${c}</button>`;
  if(x.type === "h") return open((x.art ? `<img loading="lazy" src="${x.art}" alt=""><span class="yrb">${esc(x.ylab)}<small>${esc(regName(x.region))}</small></span>` : plate(x)) + (x.video ? PLAY : ""), cap(x.title, [x.place, x.date].filter(Boolean).join(", ")));
  if(x.type === "v") return open(`<img loading="lazy" src="${x.thumb}" alt="">${x.kind !== "story" ? `<span class="tag">${esc(t("k_" + x.kind))}</span>` : ""}${PLAY}`, cap(x.title, fullDate(x.date)));
  if(x.type === "a"){ const s = store.get("ab:" + x.id, null);
    return open((x.cover ? `<img loading="lazy" src="${x.cover}" alt="">` : genCover(x)) + wave(x.id), cap(x.title, s ? t("resume_at", { t: mmss(s.t) }) : x.author)); }
  if(x.type === "c") return open(x.cover ? `<img loading="lazy" src="${x.cover}" alt="">` : genCover(x), cap(x.title, t("pages", { n: x.pages.length })));
  if(x.type === "b"){ const p = store.get("bk:" + x.key, 0);
    return open((x.cover ? `<img loading="lazy" src="${x.cover}" alt="">` : genCover(x)) + (p > 0 && p < 1 ? `<span class="prog"><i style="width:${Math.round(p * 100)}%"></i></span>` : ""), cap(x.title, x.author)); }
  if(x.type === "r") return open(x.image ? `<img loading="lazy" src="${x.image}" alt="">` : `<div class="poem">${esc(x.text)}</div>`, cap(x.title, t("art_" + x.kind)));
  return "";
}

/* ---------- lists: every row title opens its own "See all" page ---------- */
const now = new Date(), TODAY = { d: now.getDate(), m: now.getMonth() + 1 };
function onThisDay(day, m){
  const exact = H.filter(e => e.day === day && e.m === m);
  if(exact.length) return { title: t("on_this_day") + ", " + dayLabel(day, m), items: exact };
  const month = H.filter(e => e.m === m).sort((a, b) => Math.abs(a.day - day) - Math.abs(b.day - day));
  if(month.length) return { title: t("this_month"), sub: t("no_date", { d: dayLabel(day, m), m: monthName(m) }), items: month };
  const ahead = e => ((e.m - m) * 31 + (e.day - day) + 372) % 372;
  return { title: t("nearest"), items: H.filter(e => e.d).sort((a, b) => ahead(a) - ahead(b)).slice(0, 12) };
}
const midway = x => { const p = store.get("bk:" + x.key, 0); return p > 0.02 && p < 0.98; };
const LISTS = {
  today: () => onThisDay(TODAY.d, TODAY.m),
  stories: () => ({ title: t("latest_stories"), items: V, empty: t("empty_stories") }),
  audiobooks: () => ({ title: t("audiobooks"), items: A, empty: t("empty_audio") }),
  comics: () => ({ title: t("comics"), items: C, empty: t("empty_comics") }),
  books: () => ({ title: t("books"), items: B, empty: t("empty_books") }),
  art: () => ({ title: t("art"), items: R, empty: t("empty_art") }),
  foryou: () => ({ title: t("for_you"), items: H.filter(e => state.topics.includes(e.cat)).slice().reverse() }),
  featured: () => ({ title: t("featured"), items: [...V, ...H, ...B, ...A, ...C, ...R].filter(x => x.featured) }),
  continue: () => ({ title: t("continue"), items: [...A.filter(a => store.get("ab:" + a.id, null)), ...B.filter(midway), ...C.filter(midway)] }),
  history: () => ({ title: t("history"), items: H }),
  myths: () => ({ title: t("cat_Hadithi"), items: H.filter(e => e.cat === "Hadithi") })
};
ERAS.forEach(([k]) => LISTS["era-" + k] = () => ({ title: t("era_" + k), items: H.filter(e => e.era === k) }));
function rowHTML(id, opts = {}){
  const L = LISTS[id](); if(!L.items.length && (!L.empty || opts.hideEmpty) && !opts.always) return "";
  const items = L.items.slice(0, opts.max || 16);
  return `<section class="row"><a class="row-h" href="#list/${id}"><h2>${esc(L.title)}</h2><span class="more">${t("see_all")}</span></a>
    ${L.sub && opts.sub !== false ? `<div class="row-sub">${esc(L.sub)}</div>` : ""}
    <div class="track">${items.length ? items.map(card).join("") : `<div class="empty">${esc(L.empty || t("no_match"))}</div>`}</div></section>`;
}

/* ---------- home ---------- */
const KIND = { v: ["film", "stories"], h: ["time", "history"], b: ["book", "books"], a: ["head", "audiobooks"], c: ["book", "comics"], r: ["heart", "art"] };
function heroItems(){
  const pick = [], add = x => { if(x && !pick.includes(x) && pick.length < 5) pick.push(x); };
  [...V, ...B, ...A, ...C, ...R, ...H].filter(x => x.featured).forEach(add);
  add(onThisDay(TODAY.d, TODAY.m).items[0]); add(V[0]); add(B[0]); add(A[0]); add(C[0]); add(R[0]);
  H.slice().reverse().forEach(add);
  return pick;
}
function slideHTML(x, i){
  const [ic, lab] = KIND[x.type]; let bg = "", extra = "", meta = "", desc = x.desc || "";

function chunkText(text, max){ const s = text.match(/[^.!?。!?؟]+[.!?。!?؟]+\s*/g) || [text]; const out = []; let cur = "";

const pdfImg = {};

async function loadPdf(url){

async function openBook(k){

  if($("#book-ov").classList.contains("on")){
    if(ev.key === "ArrowRight"){ ev.preventDefault(); flip(LANG === "ar" ? -1 : 1); } else if(ev.key === "ArrowLeft"){ ev.preventDefault(); flip(LANG === "ar" ? 1 : -1); }
    else if(ev.key === "Escape") closeBook(); return;
  }
  if(ev.key === "Escape" && $("#sheet").classList.contains("on")) closeSheet();
});
$("#bell").onclick = togglePush;
$("#lang-sel").onchange = ev => { setLang(ev.target.value); toast(t("lang_toast")); };
let qTimer; $("#q").addEventListener("input", ev => { clearTimeout(qTimer); const q = ev.target.value.trim();
  qTimer = setTimeout(() => { if(q.length >= 2) location.hash = "#list/search:" + encodeURIComponent(q); else if(!q && current === "list") location.hash = "#home"; }, 300); });

let current = null, rendered = {};
const RENDER = { home: renderHome, stories: renderStories, history: renderHistory, mylist: renderMyList, settings: renderSettings,
  audiobooks: () => renderSimple("audiobooks", A, t("audiobooks"), t("audio_p"), t("empty_audio"), "sqg"),
  comics: () => renderSimple("comics", C, t("comics"), t("comics_p"), t("empty_comics"), true),
  books: () => renderSimple("books", B, t("books"), t("books_p"), t("empty_books"), true),
  art: () => renderSimple("art", R, t("art"), t("art_p"), t("empty_art"), "sqg"),
  library: renderLibrary };
function route(){
  let h = decodeURIComponent((location.hash || "#home").slice(1));
  const deep = h.match(/^([hvacbr])-(.+)$/);
  if(deep){ if(!current){ RENDER.home(); rendered.home = 1; show("home"); } const k = deep[1] + ":" + deep[2]; if(byKey[k]) openItem(k); return; }
  if($("#sheet").classList.contains("on")) closeSheet();
  if(h.startsWith("list/")){ renderList(h.slice(5)); show("list"); return; }
  if(!RENDER[h]) h = "home";
  if(!rendered[h] || ["mylist", "settings"].includes(h)){ RENDER[h](); rendered[h] = 1; }
  show(h);
}
function show(v){
  $("#top").classList.toggle("plain", v !== "home");
  if(current !== v) scrollTo(0, 0); current = v;
  $$(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  const tab = v === "list" ? null : ["books", "audiobooks", "comics", "art"].includes(v) && innerWidth <= 1180 ? "library" : v; $$("#nav a, #tabs a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + tab));
}
addEventListener("hashchange", route);
addEventListener("scroll", () => $("#top").classList.toggle("solid", scrollY > 40), { passive: true });
$("#s-btn").onclick = () => { $("#top").classList.toggle("s-open"); if($("#top").classList.contains("s-open")) $("#q").focus(); };
$("#q").addEventListener("blur", () => { if(!$("#q").value) $("#top").classList.remove("s-open"); });

/* ---------- start ---------- */
build(); applyStatic(); route();
if(!store.get("lang", null)){
  $("#onb-langs").innerHTML = LANGS.map(l => `<button class="chip" data-onb="${l}" aria-pressed="${l === LANG}">${LANG_NAMES[l]}</button>`).join("");
  $("#onb-langs").onclick = ev => { const b = ev.target.closest("[data-onb]"); if(!b) return; setLang(b.dataset.onb);
    $$("[data-onb]").forEach(o => o.setAttribute("aria-pressed", o === b)); };
  $("#onb-go").onclick = () => { store.set("lang", LANG); $("#onb").classList.remove("on"); };
  $("#onb").classList.add("on");
}
if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
